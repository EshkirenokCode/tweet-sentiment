services:
  api:
    build: .
    cpus: 1
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  ingress:
    image: nginx:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    cpus: 0.25
    mem_limit: 64m
    restart: unless-stopped
