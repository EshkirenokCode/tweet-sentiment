# Separate virtual host for an existing nginx-proxy-manager edge.
# Certificates are copied here by renew-certificate.sh, outside the repository.
server {
    listen 80;
    server_name tweet-sentiment.gulevskii.dev;
    access_log off;
    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tweet-sentiment.gulevskii.dev;
    access_log off;
    server_tokens off;
    ssl_certificate /data/custom_ssl/tweet-sentiment/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/tweet-sentiment/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    client_body_timeout 10s;

    # Runtime DNS avoids stale upstream IPs when this project's containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sentiment_upstream http://tweet-sentiment-ingress:8080;
    location / {
        proxy_pass $sentiment_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
}
