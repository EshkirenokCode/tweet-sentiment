name: tweet-sentiment
services:
  api:
    build:
      context: ..
    image: tweet-sentiment:1.2.0
    cpus: 1
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  ingress:
    image: nginx:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
      edge:
        aliases: [tweet-sentiment-ingress]
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: '1'
    cpus: 0.25
    mem_limit: 64m
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  default:
    internal: true
  edge:
    external: true
    name: tweet-sentiment-edge
