name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - name: Build and run the evaluated artifact in Docker
        run: |
          docker build -t tweet-sentiment .
          docker run -d --name sentiment --cpus=1 --memory=512m -p 127.0.0.1:8000:8000 tweet-sentiment
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then break; fi
            sleep 2
          done
          python scripts/http_smoke.py --url http://127.0.0.1:8000
      - if: failure()
        run: docker logs sentiment || true
